[project]
name = "smplkit-mcp"
version = "0.1.0"
description = "Hosted MCP server for the smplkit platform — schedule and run HTTP jobs from your AI agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "fastmcp>=3.4.0,<4.0.0",
  "httpx>=0.28,<0.29",
  "pydantic>=2.11,<3.0",
  "uvicorn[standard]>=0.34,<0.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "ruff==0.16.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Explicit rule selection so the enforced set is independent of ruff's
# shifting defaults (ruff 0.16.0 broadened the default set and turned a
# clean tree red org-wide). Curated modern set; the ignores drop rules that
# have no autofix and need a judgment-laden manual refactor, or that are
# pure noise on idiomatic code — so the enforced set is what `ruff --fix`
# resolves mechanically, no hand-rewrites of working code.
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "RUF", "C4", "PERF"]
ignore = [
  "SIM102", "SIM105", "SIM116", "SIM117",
  "RUF001", "RUF002", "RUF003", "RUF012", "RUF043",
  "PERF203", "PERF401", "PERF402", "PERF403",
]

# Semantic versioning of builds (ADR-057 builds were SHA-tagged; we now version
# them). semantic-release derives the version from conventional commits; CI bakes
# it into the image as APP_VERSION and tags the image with it.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = ""
upload_to_repository = false
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.changelog]
generate = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "acceptance: end-to-end tests against a real Jobs service (network + credentials required)",
]
# Unit tests run by default; the acceptance suite is opt-in via `-m acceptance`.
addopts = "-m 'not acceptance'"
